name: Auto Changelog via Ollama API

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  generate-changelog:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate changelog filename
        id: changelog
        run: |
          FILE_NAME="changelog/changelog-$(date +'%d-%m-%Y-%H-%M-%S').md"
          echo "FILE_NAME=$FILE_NAME" >> $GITHUB_ENV
          mkdir -p changelog
          echo "Changelog file: $FILE_NAME"

      - name: Fetch main branch
        run: git fetch origin main

      - name: Generate changelog via Ollama API
        env:
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
        run: |
          COMMITS=$(git log origin/main..HEAD --oneline)
          
          RESPONSE=$(curl -s -X POST "https://api.ollama.com/v1/generate" \
            -H "Authorization: Bearer $OLLAMA_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{
                  "model": "llama2",
                  "prompt": "Generate a changelog in markdown format for the following commits:\n'"$COMMITS"'"
                }')
          
          echo "$RESPONSE" > $FILE_NAME

      - name: Add changelog to git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add $FILE_NAME
          git commit -m "Add automated changelog $FILE_NAME" || echo "No changes to commit"
          git push origin HEAD:${{ github.head_ref }}